<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Junaseuranta</title>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>

<body>
    <main>
        <header>
            <div class="header-top"><small>RAUTATIELIIKENNE / LIVE</small><button id="theme-toggle" type="button"
                    aria-pressed="false">Tumma tila</button></div>
            <h1>Junaseuranta</h1>
            <p>Seuraa matkustajajunien lähtöjä Suomen asemilla.</p>
        </header>
        <section class="controls"><label for="station">Valitse asema</label><select id="station" disabled>
                <option>Ladataan asemia...</option>
            </select><button id="refresh">Päivitä tiedot</button></section>
        <p id="status" role="status">Yhdistetään palveluun...</p>
        <div class="tablewrap">
            <table>
                <thead>
                    <tr>
                        <th>Juna</th>
                        <th>Määränpää</th>
                        <th>Aikataulu</th>
                        <th>Arvio / toteutunut</th>
                        <th>Myöhästyminen</th>
                    </tr>
                </thead>
                <tbody id="trains"></tbody>
            </table>
        </div>
        <footer>Aikavyöhyke: Suomen aika. Automaattinen päivitys 30 s.<br>Data: <a
                href="https://www.digitraffic.fi/">Fintraffic / Digitraffic</a> · <a
                href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></footer>
    </main>
</body>

</html>
